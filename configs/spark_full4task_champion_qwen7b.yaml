# Paper 1 Full-Scale 4-Task Benchmark Configuration on NVIDIA DGX Spark (128 GB Coherent UMA)
# Architecture: Stage 1 Champion (`dual_late_fusion`: 3D 12-ROI 4-Stage Node Transformer + Late Connectome Bottleneck Fusion + EMA-RVQ)
#               + Stage 2 Joint `Qwen2.5-7B-Instruct` BF16 LoRA (Strict Teacher-Forcing-Free + Zero-Leakage Noise Sanity Check)
# Dataset: ALL 4 ZuCo 1.0 & 2.0 Tasks (`task1-SR`, `task2-NR`, `task3-TSR`, `task2-NR-2.0` -> ~15,000+ EEG-Text trials across 29 unique subjects!)

experiment:
  name: "neurorvq_full4task_champion_qwen7b_lora"
  seed: 42
  output_dir: "./checkpoints/neurorvq_full4task_champion_qwen7b"
  log_dir: "./logs/neurorvq_full4task_champion_qwen7b"

hardware:
  device: "cuda"
  precision: "bf16"
  uma_drop_caches_hint: true
  num_workers: 6

data:
  dataset_root: "./datasets/processed_zuco_connectome_full"
  raw_zuco_root: "./datasets/zuco_raw"
  tasks: ["task1-SR", "task2-NR", "task3-TSR", "task2-NR-2.0"]
  eeg_type: "GD"
  bands: ["_t1", "_t2", "_a1", "_a2", "_b1", "_b2", "_g1", "_g2"]
  num_channels: 105
  eeg_feature_dim: 840
  max_eeg_len: 58
  max_text_len: 64
  split_strategy: "subject_independent"
  # Strictly Unseen Test & Val Subjects spanning BOTH ZuCo 1.0 (`ZMG`, `ZPH` / `ZJS`) and ZuCo 2.0 (`YTL`, `YSL` / `YDR`)
  held_out_test_subjects: ["ZMG", "ZPH", "YTL", "YSL"]
  held_out_val_subjects: ["ZJS", "YDR"]

stage1_cet_rvq:
  stream_mode: "dual_late_fusion"
  embed_dim: 768
  encoder_layers: 4
  encoder_heads: 8
  ffn_dim: 2048
  dropout: 0.18
  proj_dropout: 0.18
  use_length_invariant_resampler: true
  num_latent_queries: 24
  use_attentive_pooler: true
  use_task_conditioning: true
  use_band_topography_norm: false
  channel_dropout: 0.15
  band_jitter: 0.10
  sensor_noise: 0.04
  token_dropout: 0.10
  rvq_num_quantizers: 6
  rvq_codebook_size: 256
  rvq_commitment_weight: 0.25
  rvq_quantizer_dropout: 0.30
  rvq_ema_decay: 0.98
  eeg_mask_ratio: 0.75
  compulsory_sentence_token_mask: true
  text_target_mode: "raw_last"
  zca_reg: 0.05
  use_multi_positive_infonce: true
  paired_subject_sampling: true
  use_cog_load_weighting: true
  init_temperature: 0.07
  learnable_temperature: true
  max_logit_scale: 14.2857
  mae_loss_weight: 0.30
  contrastive_loss_weight: 1.25
  rvq_loss_weight: 1.0
  pre_rvq_contrast_ratio: 0.30
  brain_invariance_weight: 0.25
  aux_sentiment_weight: 0.25
  label_smoothing: 0.05
  epochs: 55
  warmup_epochs: 5
  early_stop_patience: 14
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 0.05

stage2_llm:
  llm_name_or_path: "./models/Qwen2.5-7B-Instruct"
  quantization: "none"
  freeze_cet_rvq: false
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  scheduled_word_dropout_max: 0.50
  prompt_template: "Decode the following neural brain signal tokens into an exact English sentence:\n<eeg_prefix>\nDecoded sentence:"
  epochs: 16
  early_stop_patience: 5
  batch_size: 32
  grad_accum_steps: 2
  lr_projector: 2.0e-4
  lr_eeg_encoder: 3.0e-5
  lr_lora: 2.5e-5
  weight_decay: 0.01
  val_eval_num_beams: 2
  eval_num_beams: 4
  eval_repetition_penalty: 1.25
  eval_no_repeat_ngram_size: 3
  run_gaussian_noise_sanity_check: true
