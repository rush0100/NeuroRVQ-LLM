# Paper 1 Ablation Row 2: Upgraded EMA-RVQ + Dead-Code Revival on 8-10 Real Human Subjects (ZuCo 1.0 task1-SR)
# Directly compares against Ablation Row 1 (Vanilla VQ, 3 subjects) on Unseen Test Subjects!

experiment:
  name: "rush_eeg2text_emavq_qwen7b_lora_zuco_real10sub"
  seed: 42
  output_dir: "./checkpoints/rush_eeg2text_emavq_qwen7b_real10sub"
  log_dir: "./logs/rush_eeg2text_emavq_qwen7b_real10sub"

hardware:
  device: "cuda"
  precision: "bf16"
  uma_drop_caches_hint: true
  num_workers: 4

data:
  dataset_root: "./datasets/processed_zuco_10sub"
  raw_zuco_root: "./datasets/zuco_raw"
  tasks: ["task1-SR"]
  eeg_type: "GD"
  bands: ["_t1", "_t2", "_a1", "_a2", "_b1", "_b2", "_g1", "_g2"]
  num_channels: 105
  eeg_feature_dim: 840
  max_eeg_len: 58
  max_text_len: 64
  split_strategy: "subject_independent"
  # Keep ZMG as Unseen Test Subject & ZJS as Unseen Val Subject (exact same held-out subjects as Row 1!)
  held_out_test_subjects: ["ZMG"]
  held_out_val_subjects: ["ZJS"]

stage1_cet_rvq:
  embed_dim: 1024
  encoder_layers: 6
  encoder_heads: 8
  ffn_dim: 2048
  dropout: 0.1
  use_length_invariant_resampler: true
  num_latent_queries: 32
  rvq_num_quantizers: 4
  rvq_codebook_size: 512
  rvq_commitment_weight: 0.25
  eeg_mask_ratio: 0.75
  compulsory_sentence_token_mask: true
  mae_loss_weight: 0.5
  contrastive_loss_weight: 1.0
  rvq_loss_weight: 1.0
  epochs: 40
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 0.01

stage2_llm:
  llm_name_or_path: "./models/Qwen2.5-7B-Instruct"
  quantization: "none"
  freeze_cet_rvq: false                              # Jointly fine-tune EEG-RVQ encoder with straight-through gradients!
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  scheduled_word_dropout_max: 0.50                   # Ramp target dropout to 50% to break template memorization
  prompt_template: "Decode the following neural brain signal tokens into an exact English sentence:\n<eeg_prefix>\nDecoded sentence:"
  epochs: 15
  batch_size: 16
  grad_accum_steps: 2
  lr_projector: 2.0e-4
  lr_eeg_encoder: 3.0e-5
  lr_lora: 2.0e-5
  weight_decay: 0.01
  eval_num_beams: 4
  eval_repetition_penalty: 1.25
  eval_no_repeat_ngram_size: 3
  run_gaussian_noise_sanity_check: true
